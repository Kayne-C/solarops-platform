name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SolarOps.slnx

      - name: Build (warnings are errors)
        run: dotnet build SolarOps.slnx -c Release --no-restore

      - name: Test (unit, architecture, integration incl. gRPC)
        run: dotnet test --solution SolarOps.slnx -c Release --no-build

      - name: EF Core migrations match the model (SQL Server + Oracle)
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          for provider in SqlServer Oracle; do
            dotnet ef migrations has-pending-model-changes \
              --project src/SolarOps.Migrations.$provider \
              --startup-project src/SolarOps.Migrations.$provider \
              --configuration Release --no-build
          done

  containers:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/SolarOps.Api/Dockerfile -t solarops-api:${{ github.sha }} .
      - name: Build Worker image
        run: docker build -f src/SolarOps.Worker/Dockerfile -t solarops-worker:${{ github.sha }} .
